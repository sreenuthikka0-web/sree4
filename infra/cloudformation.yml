AWSTemplateFormatVersion: "2010-09-09"
Description: >
  S3 static website bucket + CloudFront distribution for Sreenu's project.
  Deploy once with:
    aws cloudformation deploy \
      --template-file infra/cloudformation.yml \
      --stack-name sreenu-website \
      --parameter-overrides ProjectName=sreenu-website

Parameters:
  ProjectName:
    Type: String
    Default: sreenu-website
    Description: Used as a prefix for all resource names

Resources:

  # ── S3 Bucket ────────────────────────────────────────────────────────────────
  WebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-${AWS::AccountId}"
      # Block all public access — CloudFront uses OAC instead
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # ── Bucket policy: allow CloudFront OAC only ─────────────────────────────────
  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontOAC
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${WebsiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub
                  - "arn:aws:cloudfront::${AWS::AccountId}:distribution/${DistId}"
                  - DistId: !GetAtt CloudFrontDistribution.Id

  # ── Origin Access Control (replaces legacy OAI) ──────────────────────────────
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${ProjectName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ── CloudFront Distribution ───────────────────────────────────────────────────
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub "CDN for ${ProjectName}"
        Enabled: true
        HttpVersion: http2and3
        DefaultRootObject: index.html

        Origins:
          - Id: S3Origin
            DomainName: !GetAtt WebsiteBucket.RegionalDomainName
            S3OriginConfig: {}          # required empty block when using OAC
            OriginAccessControlId: !GetAtt OriginAccessControl.Id

        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # CachingOptimized (AWS managed)
          Compress: true
          AllowedMethods: [GET, HEAD]
          CachedMethods:  [GET, HEAD]

        # Serve index.html for any 403/404 (SPA-friendly)
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0

        PriceClass: PriceClass_100   # US, Canada, Europe edge locations
      Tags:
        - Key: Project
          Value: !Ref ProjectName

# ── Outputs ───────────────────────────────────────────────────────────────────
Outputs:
  BucketName:
    Description: S3 bucket name (use as S3_BUCKET_NAME secret in GitHub)
    Value: !Ref WebsiteBucket
    Export:
      Name: !Sub "${ProjectName}-bucket"

  CloudFrontDistributionId:
    Description: Distribution ID (use as CLOUDFRONT_DISTRIBUTION_ID secret in GitHub)
    Value: !GetAtt CloudFrontDistribution.Id
    Export:
      Name: !Sub "${ProjectName}-cf-id"

  CloudFrontURL:
    Description: Live website URL
    Value: !Sub "https://${CloudFrontDistribution.DomainName}"
    Export:
      Name: !Sub "${ProjectName}-url"
